# TLS variant of the frontend nginx config — OPT-IN (Ola/#225 dockerize follow-up).
#
# Mounted over the image's /etc/nginx/conf.d/default.conf by
# docker-compose.tls.yml. Adds an HTTPS (:443) server using a Cloudflare Origin
# Certificate at ./certs/origin.{crt,key} so Cloudflare can reach the origin in
# Full (strict) mode. The plain :80 server is kept for on-box health checks and
# direct access. Routes mirror frontend/nginx.conf exactly.
#
# server_name is a catch-all (_): the mounted CF Origin cert (./certs) decides
# which hostnames are valid, and Cloudflare forwards the real Host header.

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/   { proxy_pass http://backend:8890; }
    location /health { proxy_pass http://backend:8890/health; }
    location /       { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/   { proxy_pass http://backend:8890; }
    location /health { proxy_pass http://backend:8890/health; }
    location /       { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
