# nginx config baked into the frontend image (Ola/#225 dockerize).
# Serves the static Vite build and reverse-proxies the API to the backend
# container. `backend` resolves via Docker's embedded DNS to the compose
# service of the same name. Mirrors the box4 bare-metal nginx (DEPLOY_BOX4
# section 4) but lives inside the container so the box only runs Docker.

server {
    listen 80;
    server_name _;

    # Cloudflare-fronted: trust the real client IP it forwards.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8890;
    }

    location /health {
        proxy_pass http://backend:8890/health;
    }

    # SPA: serve the file if it exists, else fall back to index.html so
    # client-side routes resolve.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
